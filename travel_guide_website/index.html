<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanderVista Group Tours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="home">
<nav id="nav"></nav>
<header class="hero">
  <div class="container hero-content">
    <span class="eyebrow" id="heroEyebrow"></span>
    <h1 id="heroHeading"></h1>
    <p id="heroText"></p>
    <div class="hero-buttons">
      <a class="btn primary" href="#upcoming">Explore Japan & Korea →</a>
      <a class="btn secondary" href="tours.html">View destinations</a>
    </div>
  </div>
</header>
<main>
  <section class="container" style="position:relative"><div class="stats" id="stats"></div></section>
  <section class="section" id="upcoming"><div class="container"><div class="upcoming" id="upcomingBlock"></div></div></section>
  <section class="section" id="destinations"><div class="container">
    <div class="section-head"><div><div class="kicker">Your world, our route</div><h2>Group Tours</h2></div><a class="btn solid" href="tours.html">All tours</a></div>
    <div class="destination-grid" id="destinationGrid"></div>
  </div></section>
  <section class="section video-section" id="videos"><div class="container">
    <div class="section-head"><div><div class="kicker">Watch the feeling</div><h2>Destination previews</h2></div></div>
    <div class="video-grid" id="videoGrid"></div>
  </div></section>
  <section class="section" id="about"><div class="container why">
    <div class="why-image"></div>
    <div id="aboutCopy"></div>
  </div></section>
  <section class="section"><div class="container">
    <div class="section-head"><div><div class="kicker">Travellers</div><h2>Testimonials</h2></div></div>
    <div class="quote-grid" id="testimonialGrid"></div>
  </div></section>
  <section class="section"><div class="container">
    <div class="section-head"><div><div class="kicker">Stories</div><h2>From the journal</h2></div><a href="blog.html">All posts</a></div>
    <div class="card-grid" id="blogPreview"></div>
  </div></section>
  <section class="section" id="faq"><div class="container">
    <div class="section-head"><div><div class="kicker">Common questions</div><h2>FAQ</h2></div></div>
    <div class="faq-section" id="faqList"></div>
  </div></section>
  <section class="section" id="contact"><div class="container"><div class="contact" id="contactBlock"></div></div></section>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/site.js"></script>
</body>
</html>
